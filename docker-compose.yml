services:

  mysql:
    image: mysql:8.4
    container_name: secure-user-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: secure_user_db

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

  app:
    build: .
    container_name: secure-user-api
    restart: unless-stopped

    depends_on:
      - mysql

    ports:
      - "8080:8080"

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/secure_user_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root

      JWT_SECRET: VGhpc0lzQURldmVsb3BtZW50U2VjcmV0S2V5VGhhdElzTG9uZ0Vub3VnaA

      FRONTEND_URL: http://localhost:5173

volumes:
  mysql_data: